# Nginx config for аромазон-тут.рф — same-origin proxy so the browser only
# ever talks to one origin (cookies just work, no CORS needed).
#   /api/*          -> Fastify backend (api/, port 4000)
#   everything else -> Next.js (web/, port 3000)
#   admin. subdomain -> static admin/dist (Vite SPA)
#
# IMPORTANT — punycode. Nginx and certbot don't understand Cyrillic domain
# names; they must be written in punycode (IDNA) form:
#   аромазон-тут.рф        = xn----7sba2axiddn1aal.xn--p1ai
#   admin.аромазон-тут.рф  = admin.xn----7sba2axiddn1aal.xn--p1ai
# (check: python3 -c "print('аромазон-тут.рф'.encode('idna').decode())")
#
# IMPORTANT — this is an HTTP-only (port 80) bootstrap config on purpose.
# A `listen 443 ssl` block without existing certificate files makes
# `nginx -t` fail, so nginx can't start and `certbot --nginx` can't run.
# Install this file as-is, get the site working over http://, then run
# certbot (see deploy/README.md step 10): it adds the `listen 443 ssl`
# lines, certificate paths and the http -> https redirect to these same
# server blocks automatically.
#
# Not applied automatically — copy into /etc/nginx/sites-available/,
# symlink into sites-enabled, `nginx -t`, reload.

server {
    listen 80;
    listen [::]:80;
    server_name xn----7sba2axiddn1aal.xn--p1ai www.xn----7sba2axiddn1aal.xn--p1ai;

    client_max_body_size 4m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/* on the frontend maps 1:1 to /api/* on the Fastify app
        # (routes are registered with the /api prefix baked in — see
        # api/src/index.ts) — no path rewrite needed here.
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# admin/ is a separate Vite SPA — deliberately not proxied through Node at
# all, it's just static files after `npm run build`. It calls the *main*
# domain's /api/admin/* cross-origin (see api/.env's ADMIN_ORIGIN +
# admin/.env's VITE_API_URL) — CORS is handled backend-side
# (api/src/index.ts), and the az_admin_session cookie is host-only on the
# main domain with SameSite=Lax, which browsers still send on same-site
# (same registrable domain) cross-origin fetches from this subdomain, so no
# cookie `domain` attribute needs setting anywhere.
server {
    listen 80;
    listen [::]:80;
    server_name admin.xn----7sba2axiddn1aal.xn--p1ai;

    root /var/www/aroma-zone/admin/dist;
    index index.html;

    location / {
        # SPA fallback — react-router handles the real routing client-side.
        try_files $uri $uri/ /index.html;
    }
}
